name: Windows Build

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Upstream Sync"]
    types: [completed]
    branches: [main]

concurrency:
  group: windows-installer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run tauri -- build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | ForEach-Object { $_.FullName })
          if ($installers.Count -eq 0) {
            throw "No Windows installer (.exe) found."
          }

          $version = (node -p "require('./package.json').version").Trim()
          $tag = "v$version-build.${{ github.run_number }}"
          $title = "Windows v$version (build #${{ github.run_number }})"

          gh release create $tag @installers --title $title --generate-notes --prerelease
